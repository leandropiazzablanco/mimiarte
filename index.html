<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIMI ARTE</title>
<!-- Ícono y nombre del acceso directo en el iPhone -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIMI ARTE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  iframe{flex:1;width:100%;border:0;display:block}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;color:#7b8094;transition:opacity .3s}
  #splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 4px 14px rgba(20,24,40,.08)}
  #splash.off{opacity:0;pointer-events:none}
  a{color:#c2185b}
</style>
</head>
<body>
<div id="splash"><img src="logo.jpg" alt="MIMI ARTE"><span id="msg">Cargando…</span></div>
<script>
  // ⬇⬇⬇ Pegá acá la URL de la aplicación web de Apps Script (la que termina en /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyLM7ND17uTfy_yfPtJ3RWqirAPxeiKiAwyGCNCZIhttYN2z6khN9SauenNBw7zp3SjmA/exec';

  const splash = document.getElementById('splash'), msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    msg.innerHTML = 'Falta pegar la URL de la app en este archivo (APP_URL).';
  } else {
    const f = document.createElement('iframe');
    f.src = APP_URL;
    f.title = 'MIMI ARTE';
    f.allow = 'clipboard-write';
    f.onload = () => splash.classList.add('off');
    document.body.appendChild(f);
    // Si a los 15 segundos no cargó, ofrecer abrirla directo
    setTimeout(() => {
      if (!splash.classList.contains('off')) msg.innerHTML = 'Está tardando… <a href="' + APP_URL + '">Abrir la app directamente</a>';
    }, 15000);
  }
</script>
</body>
</html>
